name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AgentPluginValidator.sln --nologo

      - name: Build
        run: dotnet build AgentPluginValidator.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test AgentPluginValidator.sln --configuration Release --no-build --no-restore --nologo
